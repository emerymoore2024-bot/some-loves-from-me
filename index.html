<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eee9"><title>For Jack!</title><style>:root{--cream:#f7f7f4;--pink:#deded8;--ink:#242622;--muted:#767a73;--paper:#ffffff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:510px;margin:auto;padding:32px 22px 70px}.eyebrow{font:11px system-ui;letter-spacing:3px;text-transform:uppercase;text-align:center;color:var(--muted)}h1{text-align:center;font-weight:500;font-size:35px;margin:14px 0 7px}header p{text-align:center;color:var(--muted);font-style:italic}.heart{text-align:center;color:#62675e;font-size:24px}.card{background:var(--paper);padding:22px;margin-top:24px;border-radius:14px;box-shadow:0 8px 25px #72575912}.card h2{font-weight:500;font-size:23px;margin:0 0 13px}.photo{width:100%;height:230px;object-fit:cover;background:#efefeb;border:10px solid white;box-shadow:0 3px 13px #0001}.placeholder{height:230px;display:flex;align-items:center;justify-content:center;background:#efefeb;color:#777b74;border:10px solid white;font-style:italic;text-align:center;padding:20px}.note{line-height:1.65;font-size:17px;white-space:pre-line}.small{color:var(--muted);font:12px system-ui}.btn{border:0;background:#242622;color:#fff;border-radius:8px;padding:13px 18px;font:600 13px system-ui;cursor:pointer}.btn:focus-visible,.tile:focus-visible{outline:3px solid #936a75} .tile{display:block;width:100%;text-align:left;background:#f1f2ee;border:0;border-radius:8px;padding:17px;margin:9px 0;color:var(--ink);font:16px system-ui;cursor:pointer}.tile span{float:right}.hidden{display:none}.footer{text-align:center;margin-top:32px;font:12px system-ui;color:var(--muted)}#error{font:13px system-ui;color:#9b4242}</style></head><body><main><div class="eyebrow">just for you</div><div class="heart">♡</div><header><h1>hi jack ♡</h1><p>a little something from me to you</p></header><section class="card"><div class="small">01 / JUST FOR TODAY</div><h2>a note from me</h2><div id="dailyPhoto" class="placeholder">Our favorite photo goes here</div><p id="dailyNote" class="note">Loading your note...</p><p id="updated" class="small"></p></section><section class="card"><div class="small">02 / A LITTLE UNEXPECTED</div><h2>Surprise me</h2><p class="small">just because</p><button class="btn" id="surpriseButton">Open a surprise</button><div id="surpriseContent" class="hidden"><div id="surprisePhoto" style="margin-top:18px"></div><p id="surpriseNote" class="note"></p></div></section><section class="card"><div class="small">03 / FOR EVERY KIND OF DAY</div><h2>Open when...</h2><div id="openWhen"></div><div id="opened" class="hidden"><button class="btn" id="backButton">← All letters</button><h2 id="openedTitle" style="margin-top:18px"></h2><div id="openedPhoto"></div><p class="note" id="openedNote"></p></div></section><p id="error"></p><div class="footer">love you ♡</div></main><script>let content;const $=id=>document.getElementById(id);function photo(target,url,alt){target.innerHTML='';if(url){let im=document.createElement('img');im.className='photo';im.src=url;im.alt=alt||'Our photo';im.onerror=()=>{target.textContent='Photo unavailable';};target.append(im)}else{target.className='placeholder';target.textContent='photo coming soon'}}function showNote(target,text){target.textContent=text||''}function openLetter(letter){$('openWhen').classList.add('hidden');$('opened').classList.remove('hidden');$('openedTitle').textContent=letter.title;photo($('openedPhoto'),letter.photo,letter.title);showNote($('openedNote'),letter.message)}$('backButton').onclick=()=>{$('opened').classList.add('hidden');$('openWhen').classList.remove('hidden')};$('surpriseButton').onclick=()=>{if(!content)return;const a=content.surprises||[];if(!a.length)return;let i=Math.floor(Math.random()*a.length);if(a.length>1&&i===window.lastSurprise)i=(i+1)%a.length;window.lastSurprise=i;const s=a[i];$('surpriseContent').classList.remove('hidden');photo($('surprisePhoto'),s.photo,'Surprise photo');showNote($('surpriseNote'),s.message)};async function load(){try{const r=await fetch('./content.json?refresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Could not load notes');content=await r.json();photo($('dailyPhoto'),content.daily?.photo,'Today’s photo');showNote($('dailyNote'),content.daily?.message);$('updated').textContent=content.daily?.date?'A note for '+content.daily.date:'';for(const l of content.openWhen||[]){const b=document.createElement('button');b.className='tile';b.textContent=l.title;const arrow=document.createElement('span');arrow.textContent='→';b.append(arrow);b.onclick=()=>openLetter(l);$('openWhen').append(b)}}catch(e){$('error').textContent='Notes could not load. Please refresh when connected to the internet.';showNote($('dailyNote'),'Your note is waiting for you ♡')}}load();</script></body></html>
